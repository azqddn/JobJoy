<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/app}">
<head>
    <meta charset="UTF-8">
    <title>Job List</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Job List</h1>
    <a class="btn btn-secondary" th:href="@{/job/create}">Create new application</a>

    <table class="table">
        <thead>
        <tr>
            <th scope="col">No.</th>
            <th scope="col">Job Title</th>
            <th scope="col">Company/References</th>
            <th scope="col">Method</th>
            <th scope="col">Resume/Cover Letter</th>
            <th scope="col">Application Date</th>
            <th scope="col">Status</th>
            <th scope="col">Notes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(jobs)}">
            <td colspan="10" class="text-center">No records found.</td>
        </tr>
        <tr th:each="job, loop : ${jobs}">
            <th scope="row" th:text="${loop.index + 1}"></th>
            <td th:text="${job.jobTitle}"></td>
            <td>
                <p th:text="${job.companyName}"></p>
                <p th:text="${job.location}"></p>
                <p><a th:href="${job.jobLink}" th:text="${job.jobLink}"></a></p>
                <p th:text="${job.hrEmail}"></p>
            </td>
            <td th:text="${job.applicationMethod}"></td>
            <td>
<!--                <a th:href="@{/job/view/{filePath}(filePath=${job.resume.originalFileName})}" target="_blank">resume</a>-->
            </td>
            <td th:text="${job.applicationDate}"></td>
            <td th:text="${job.status}"></td>
            <td th:text="${job.notes}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
