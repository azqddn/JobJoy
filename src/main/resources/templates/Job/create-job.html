<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/app}">
<head>
  <meta charset="UTF-8">
  <title>Job Create</title>
</head>
<body>
<div layout:fragment="content">
  <h1>Create Job</h1>
  <form th:action="@{/job/create}" th:object="${job}" method="post">

    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
      <p>Please correct the errors below</p>
    </div>

    <label for="jobTitle">Job Title:</label>
    <input type="text" id="jobTitle" name="jobTitle" th:field="*{jobTitle}" required />

    <label for="companyName">Company Name:</label>
    <input type="text" id="companyName" name="companyName" th:field="*{companyName}" required />

    <label for="location">Location:</label>
    <input type="text" id="location" name="location" th:field="*{location}" />

    <label for="applicationMethod">Application Method:</label>
    <input type="text" id="applicationMethod" name="applicationMethod" th:field="*{applicationMethod}" />

    <label for="jobLink">Job Link:</label>
    <input type="url" id="jobLink" name="jobLink" th:field="*{jobLink}" />

    <label for="hrEmail">HR Email:</label>
    <input type="email" id="hrEmail" name="hrEmail" th:field="*{hrEmail}" />

    <label for="resumeId" class="form-label">Resume:</label>
    <select class="" id="resumeId" th:field="*{resumeId}">
      <option th:each="resume : ${resumes}"
              th:value="${resume.resumeId}"
              th:text="${resume.title}"></option>
    </select>

    <label for="status" class="form-label">Status:</label>
    <select id="status" name="status" th:field="*{status}" class="">
      <option th:each="status : ${T(com.aziq.JobJoy.Job.Entity.Job.Status).values()}"
              th:value="${status}"
              th:text="${status}">
      </option>
    </select>

    <label for="applicationDate">Application Date:</label>
    <input type="date" id="applicationDate" name="applicationDate" th:field="*{applicationDate}" />

    <label for="notes">Notes:</label>
    <textarea id="notes" name="notes" th:field="*{notes}"></textarea>

    <button type="submit">Submit</button>
    <button type="button" class="btn btn-primary" data-mdb-ripple-init>Button</button>
  </form>
</div>
</body>
</html>
