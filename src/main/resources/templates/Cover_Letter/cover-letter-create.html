<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Fragments/app}">>
<head>
    <meta charset="UTF-8">
    <title>Add New Cover Letter</title>
</head>
<body>
<div layout:fragment="content">
    <h1>Create Cover Letter</h1>
    <form th:action="@{/cover-letter/create}" enctype="multipart/form-data" th:object="${coverLetters}" method="post">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="file">File:</label>
        <input type="file" id="file" name="file" required><br><br>

        <label for="notes">Notes:</label>
        <input type="text" id="notes" name="notes"><br><br>

        <button type="submit">Add</button>
    </form>
</div>
</body>
</html>
